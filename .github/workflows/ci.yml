name: Obscura CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build, Circuit Verification & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install root dependencies
        run: npm install --no-audit

      - name: Install frontend dependencies
        run: npm --prefix frontend install --no-audit

      - name: Run Compact Compile (compact compile)
        run: npm run compact:compile

      - name: Run Complete Test Suite (17 Tests Passing)
        run: npm test

      - name: Compile and deploy to local devnet simulation
        run: npm run deploy:local

      - name: Build contract and frontend production bundles
        run: npm run build
